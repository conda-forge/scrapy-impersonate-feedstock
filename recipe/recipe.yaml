schema_version: 1

context:
  version: "1.10.1"

package:
  name: scrapy-impersonate
  version: ${{ version }}

source:
  url: https://github.com/jxlil/scrapy-impersonate/archive/refs/tags/${{ version }}.tar.gz
  sha256: c77931c6587504da642cc3566dfcd7bda06ff62c31866209c0c2cf02ca9cf4fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - curl-cffi >=0.15.0
    - scrapy >=2.13.4

tests:
  - python:
      imports:
        - scrapy_impersonate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Scrapy download handler that can impersonate browser fingerprints
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jxlil/scrapy-impersonate

extra:
  recipe-maintainers:
    - holymonson
